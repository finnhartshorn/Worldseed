[package]
name = "worldseed"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18.1", features = ["pan_camera", "debug"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
crc32fast = "1.4"
rand = "0.9.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
debug_chunks = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
